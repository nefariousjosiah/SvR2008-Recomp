# SvR 2008 (XDK 2.0.5632) D3D library functions, confirmed by behaviour (not by size alone).
# Format follows ReXGlue's [functions] table so it can later be included in the codegen config to
# give these functions their D3D names. Evidence is in the comment after each entry.
# Candidates from the size alignment (d3d_functions_aligned.txt) are only listed here once checked.

[functions]
# Device / frame
0x8223AEF8 = { name = "D3DDevice_Present" }            # SetRenderTarget, sync, Resolve(11 args), Swap(frontbuffer @device+0x39D4)
0x8223A960 = { name = "D3DDevice_Swap" }               # only caller of VdSwap and VdPersistDisplay
0x8223A4B8 = { name = "D3DDevice_SynchronizeToPresentationInterval" }  # reads present interval (device+0x3504), called by Present
0x82249340 = { name = "D3DDevice_Resolve" }            # 3652 bytes, called by Present with 11 args
0x822407E0 = { name = "D3DDevice_SetRenderTarget" }    # Present: (device, 0, backbuffer surface)
0x8223FD58 = { name = "D3DDevice_SetScissorRect" }     # copies RECT to device+0x317C, clamps to viewport floats at +0x3160

# Resource creation (census: called while loading; behaviour below)
0x82237500 = { name = "D3DDevice_CreateTexture" }      # size-aligned; census args (w, h, levels, usage, 0, format...), calls XG texture header setup
0x82237620 = { name = "D3DDevice_CreateSurface" }      # census: (1280, 720, EDRAM surface format 0x18280186, ...)
0x82242D18 = { name = "D3DDevice_CreateVertexDeclaration" } # walks 12-byte D3DVERTEXELEMENT9 until Stream 0xFF, allocates 56 + n*12
0x82242FE0 = { name = "D3DDevice_CreateVertexShader" } # allocs, copies microcode, calls XGRegisterVertexShader 0x82242900
0x82242ED0 = { name = "D3DDevice_CreatePixelShader" }  # same as CreateVertexShader without the register step

# State (census: per-frame calls from the engine's draw path)
0x82237868 = { name = "D3DDevice_SetTexture" }         # (device, sampler, texture); 46k calls boot..title
0x822429F8 = { name = "D3DDevice_SetVertexShader" }    # (device, shader), called next to SetPixelShader by engine 0x82482638
0x822426F8 = { name = "D3DDevice_SetPixelShader" }     # (device, shader), engine 0x82482648
0x82242C10 = { name = "D3DDevice_SetVertexDeclaration" } # (device, decl) before each engine draw (0x8248A818)
0x8223FEA8 = { name = "D3DDevice_SetStreamSource" }    # size-aligned; (device, stream, vb, offset, stride) from engine
0x82240050 = { name = "D3DDevice_SetIndices" }         # size-aligned (equal size); from engine 0x82480968
0x82240B48 = { name = "D3DDevice_SetDepthStencilSurface" } # (device, surface) once per frame from engine
0x8224E9D8 = { name = "D3DDevice_Clear" }              # once per frame from engine: (device, 0, NULL, flags 0x3F, color 0xFF000000, ...)

# Draws (linked outside the main D3D range, 0x825AAxxx)
0x825AAF28 = { name = "D3DDevice_BeginVertices" }      # flushes dirty state, DRAW_INDX 0xC0012201, returns vertex pointer
0x825AB3C8 = { name = "D3DDevice_EndVertices" }        # called right after BeginVertices + memcpy by engine sub_8248F310
0x825AB3E8 = { name = "D3DDevice_DrawVertices" }       # dirty-state flush + DRAW_INDX, auto-index
0x825AB7D0 = { name = "D3DDevice_DrawIndexedVertices" } # dirty-state flush + DRAW_INDX with source select DMA (0x800)

# Helpers
0x82238910 = { name = "D3DResource_BlockUntilNotBusy" } # (resource): waits on resource->Fence (+0x08) via sub_822386B8
0x822386B8 = { name = "D3D_BlockOnFenceImpl" }         # (device, fence, flags): polls GPU fence, spins via sub_82239E68

# Globals
# 0x82000898  kernel import slot -> VdGlobalDevice (holds the D3D device pointer)
# 0x82E6E49C  engine render object; +128 = D3D device (used by engine draw wrappers like sub_8248F310)
